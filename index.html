<style>
/* Layout: RTL course shell — course hero on home, right sidebar on desktop, sticky top bar + bottom tabs on phones; lessons read as numbered lesson stages, SAP screens as LTR simulated windows */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F5F8F9; --ink:#13212B; --muted:#56676F; --line:#D3DCE0;
  --accent:#0B6670; --accent-ink:#FFFFFF; --accent-soft:#DCEEEF;
  --hero:#0A4F57; --hero-ink:#FFFFFF; --hero-muted:#B9D9DC; --gold:#E2B33C;
  --ok:#24734A; --ok-soft:#DDF0E4; --prog:#2B5DA6; --prog-soft:#E0E9F7;
  --rev:#9C5A08; --rev-soft:#FBEACF; --none:#6E7E87; --none-soft:#E6ECEE;
  --bad:#B3261E; --bad-soft:#F8E0DD; --sample:#5F4598; --sample-soft:#ECE6F7; --note:#7A6000; --note-soft:#FFF3C4;
  --sap-frame:#AFC0C9; --sap-bar:#D9E3E9; --sap-field:#FFFFFF; --sap-bg:#F2F5F7; --sap-key:#1D4E89;
  --shadow:0 1px 2px rgba(19,33,43,.06),0 4px 14px rgba(19,33,43,.05);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1317; --surface:#131D23; --surface-2:#18242B; --ink:#E1E9ED; --muted:#93A4AD; --line:#283841;
  --accent:#4FB4BC; --accent-ink:#06171A; --accent-soft:#12333A;
  --hero:#0F353B; --hero-ink:#EAF5F6; --hero-muted:#9CC4C8; --gold:#E9C25A;
  --ok:#6BC98E; --ok-soft:#15301F; --prog:#83A9E8; --prog-soft:#172741; --rev:#E8A64A; --rev-soft:#382810;
  --none:#8D9CA5; --none-soft:#1E2A30; --bad:#F08A82; --bad-soft:#3A1A18; --sample:#B8A2EA; --sample-soft:#251D37; --note:#E5C75B; --note-soft:#30290D;
  --sap-frame:#3A4D57; --sap-bar:#1D2B33; --sap-field:#0E171C; --sap-bg:#152027; --sap-key:#8FB6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1317; --surface:#131D23; --surface-2:#18242B; --ink:#E1E9ED; --muted:#93A4AD; --line:#283841;
  --accent:#4FB4BC; --accent-ink:#06171A; --accent-soft:#12333A;
  --hero:#0F353B; --hero-ink:#EAF5F6; --hero-muted:#9CC4C8; --gold:#E9C25A;
  --ok:#6BC98E; --ok-soft:#15301F; --prog:#83A9E8; --prog-soft:#172741; --rev:#E8A64A; --rev-soft:#382810;
  --none:#8D9CA5; --none-soft:#1E2A30; --bad:#F08A82; --bad-soft:#3A1A18; --sample:#B8A2EA; --sample-soft:#251D37; --note:#E5C75B; --note-soft:#30290D;
  --sap-frame:#3A4D57; --sap-bar:#1D2B33; --sap-field:#0E171C; --sap-bg:#152027; --sap-key:#8FB6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.en{font-family:var(--f-mono);font-size:.82em;color:var(--muted);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.num,td.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tc{font-family:var(--f-mono);font-size:.82rem;direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.tc::before{content:"/n";color:var(--muted)}
.tc.mv::before{content:"mvt ";}
.tc.plain::before{content:none}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:var(--ink)}
.mark{width:32px;height:32px;border-radius:8px;background:var(--hero);color:var(--gold);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:500;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store{font-size:.72rem;padding:3px 8px;flex:none;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.store.db{color:var(--ok);border-color:currentColor}
.store.local{color:var(--muted);border-color:var(--line)}
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:.72rem}
.tabs a svg{width:21px;height:21px}
.tabs a.on{color:var(--accent);font-weight:600}
@media (max-width:420px){.brand b{font-size:.92rem}.mark{width:28px;height:28px}.top{gap:8px}}
@media (min-width:960px){
  .shell{grid-template-columns:260px 1fr}
  .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);align-self:start;height:calc(100vh - 53px);overflow:auto;border-left:1px solid var(--line);background:var(--surface);padding:12px 12px 24px}
  .tabs{display:none}
  main{padding-bottom:48px}
}
.side .grp{font-size:.72rem;color:var(--muted);letter-spacing:.02em;margin:16px 10px 6px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.9rem}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .ln{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:16px;text-align:center}
.side .prog{margin:4px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--none);margin-inline-start:auto}
.dot.ok{background:var(--ok)}.dot.prog{background:var(--prog)}.dot.rev{background:var(--rev)}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lede{color:var(--muted);max-width:65ch}
.eyebrow{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.prose p+p{margin-top:8px}
.prose{max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* course hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto auto -60px -60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.05);pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-size:clamp(1.3rem,5.2vw,2.3rem);line-height:1.4}
.hero .lede{color:var(--hero-muted);font-size:1rem}
.hero .btn{background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.35)}
.hero .btn.gold{background:var(--gold);color:#1B1606;border-color:var(--gold)}
.byline{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1B1606;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.byline b{display:block;font-family:var(--f-display);font-weight:600}
.byline span{font-size:.82rem;color:var(--hero-muted)}
.meter{display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.meter .track{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.meter .fill{height:100%;background:var(--gold);border-radius:99px}
.modules{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.modules{grid-template-columns:1fr 1fr}}
.module{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.module .mh{display:flex;align-items:center;gap:10px}
.module .mn{font-family:var(--f-display);font-weight:700;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.module ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.module li a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:.92rem}
.module li a:hover{color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;counter-reset:f}
@media (min-width:700px){.flow{grid-template-columns:repeat(5,minmax(0,1fr))}}
.flow div{counter-increment:f;border-top:3px solid var(--accent);background:var(--surface);border-radius:0 0 8px 8px;padding:10px 12px;font-size:.85rem;min-width:0}
.flow div::before{content:counter(f);font-family:var(--f-mono);color:var(--accent);font-size:.78rem;display:block}
.flow div:last-child{grid-column:span 2}
@media (min-width:700px){.flow div:last-child{grid-column:auto}}
[id^="s-"],.q{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.flow b{display:block;font-family:var(--f-display);font-weight:600;font-size:.95rem}

/* lesson header */
.lhead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--accent)}
.lprog{display:grid;gap:4px}
.lprog a{height:6px;border-radius:99px;background:var(--none-soft)}
.lprog a.ok{background:var(--ok)}.lprog a.prog{background:var(--prog)}.lprog a.rev{background:var(--rev)}
.lprog a.cur{outline:2px solid var(--accent);outline-offset:2px}
.goals{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.goals ul{margin:0;padding-inline-start:18px}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump a{font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}
.jump a:hover{border-color:var(--accent);color:var(--accent)}
.stg{display:flex;align-items:center;gap:10px}
.stg i{font-style:normal;font-family:var(--f-mono);font-size:.78rem;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}

/* labels */
.lab{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.01em}
.lab.ref{background:var(--accent-soft);color:var(--accent)}
.lab.sample{background:var(--sample-soft);color:var(--sample)}
.lab.mine{background:var(--note-soft);color:var(--note)}
.lab.miss{background:transparent;color:var(--bad);border:1px dashed var(--bad)}
.lab.sim{background:var(--sap-bar);color:var(--sap-key)}
.lab.exp{background:var(--hero);color:var(--gold)}

ol.cyc{margin:4px 0 10px;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.hero .ind{font-size:.78rem;padding:2px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.3);color:var(--hero-ink)}
.ind2{font-size:.76rem;padding:2px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.term{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);text-decoration:none;color:var(--ink);font-size:.82rem}
.term:hover{border-color:var(--accent)}
.term b{font-weight:600}
.ensent{border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);align-items:flex-start}
.en-l{direction:ltr;text-align:left;font-family:var(--f-body);font-weight:600;font-size:.95rem;align-self:stretch}
.verify{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--bad);border-radius:8px;padding:10px 12px;align-items:flex-start}
.lab.cma{background:var(--prog-soft);color:var(--prog)}
.ex.multi td:first-child{width:auto}
.cx .tbl table{min-width:620px}
.cx{min-width:0}
.lhead .en,.titem .en,.prose .en,.terms .en,.situ .en,.ensent .en,.goals .en{white-space:normal;overflow-wrap:anywhere}
.term{flex-wrap:wrap;max-width:100%}
.lhead .sec-h>div{min-width:0}
.lhead h1{overflow-wrap:anywhere}
.ex.multi td.n,.ex.multi th{white-space:nowrap}
.card.exp{border-inline-start:3px solid var(--gold);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.card.mine{border-color:var(--note);background:linear-gradient(var(--note-soft),var(--note-soft)) top/100% 3px no-repeat,var(--surface)}
.card.miss{border:1px dashed var(--bad)}

/* SAP screen simulation */
.sap{direction:ltr;text-align:left;border:1px solid var(--sap-frame);border-radius:8px;overflow:hidden;background:var(--sap-bg);font-size:.82rem;min-width:0}
.sap .tb{background:var(--sap-bar);border-bottom:1px solid var(--sap-frame);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sap .tb b{font-weight:600;font-size:.88rem}
.sap .cmd{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--sap-frame);flex-wrap:wrap}
.sap .cmd code{font-family:var(--f-mono);background:var(--sap-field);border:1px solid var(--sap-frame);border-radius:3px;padding:1px 8px;min-width:120px}
.sap .cmd span{font-size:.75rem;color:var(--muted)}
.sap .tabsr{display:flex;gap:2px;padding:6px 12px 0;flex-wrap:wrap;border-bottom:1px solid var(--sap-frame)}
.sap .tabsr span{padding:4px 10px;border:1px solid var(--sap-frame);border-bottom:0;border-radius:4px 4px 0 0;font-size:.76rem;color:var(--muted);background:var(--sap-bar)}
.sap .tabsr span.on{background:var(--sap-bg);color:var(--ink);font-weight:600}
.sap .body{padding:12px;display:flex;flex-direction:column;gap:12px}
.sap .grpb{border:1px solid var(--sap-frame);border-radius:4px;padding:10px;position:relative;display:flex;flex-direction:column;gap:6px}
.sap .grpb > .gt{font-size:.74rem;color:var(--sap-key);font-weight:600}
.sap .flds{display:grid;grid-template-columns:1fr;gap:6px 18px}
@media (min-width:640px){.sap .flds{grid-template-columns:1fr 1fr}}
.sap .fld{display:grid;grid-template-columns:minmax(110px,44%) 1fr;gap:8px;align-items:center;min-width:0}
.sap .fld label{color:var(--muted);font-size:.78rem}
.sap .v{background:var(--sap-field);border:1px solid var(--sap-frame);border-radius:3px;padding:2px 8px;min-height:26px;font-family:var(--f-mono);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sap .v.hl{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.sap .v small{color:var(--muted);font-family:var(--f-body)}
.sap .tblw{overflow-x:auto;border:1px solid var(--sap-frame);border-radius:4px;background:var(--sap-field)}
.sap table{font-size:.76rem;min-width:520px}
.sap th{background:var(--sap-bar);color:var(--ink);text-align:left;font-weight:600;border-bottom:1px solid var(--sap-frame);white-space:nowrap}
.sap td{text-align:left;font-family:var(--f-mono);border-bottom:1px solid var(--line);white-space:nowrap}
.sap td.r{text-align:right}
.sap tr.hl td{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.sap tr.tot td{font-weight:600;border-top:1px solid var(--sap-frame)}
.sap .btns{display:flex;gap:6px;flex-wrap:wrap}
.sap .btns span{border:1px solid var(--sap-frame);background:var(--sap-bar);border-radius:3px;padding:2px 10px;font-size:.75rem}
.sap .radio{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem}
.sap .radio span::before{content:"○ ";color:var(--muted)}
.sap .radio span.on::before{content:"● ";color:var(--sap-key)}
.sapnote{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.sapnote ul{margin:0;padding-inline-start:18px}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--prog-soft);color:var(--prog)}
.chip.rev{background:var(--rev-soft);color:var(--rev)}
.chip.none{background:var(--none-soft);color:var(--none)}

/* buttons/forms */

async function initStore(){

  if(!use){Store.loading=false;setStoreChip();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([use("db"),use("user")])}catch(e){}
  if(!db||!user){Store.loading=false;setStoreChip();return}
  let id=null; try{id=await user.id()}catch(e){}
  let canW=null; try{canW=user.can?await user.can("data.write"):null}catch(e){}
  if(!id||canW===false){Store.loading=false;setStoreChip();return}
  Store.db=db;Store.uid=id;Store.col=db.collection("data/users/"+id);

  Store.col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(Store.timer);
    if(Store.forcedLocal)return;
    const next=emptyState();
    snap.docs.forEach(d=>{const b=d.data();if(!b)return;
      if(d.id==="profile")next.profile=Object.assign({topics:{},missing:{},plan:{}},JSON.parse(JSON.stringify(b)));
      else if(b.kind==="attempt")next.attempts.push(Object.assign({id:d.id},b));
      else if(b.kind==="question")next.questions.push(Object.assign({id:d.id},b));});
    Store.dbEmpty=snap.empty; Store.mode="db"; Store.loading=false; S=next; setStoreChip(); render();
  },err=>{clearTimeout(Store.timer);Store.loading=false;Store.mode="local";setStoreChip("تعذر الوصول لحسابك، الحفظ مؤقتاً في المتصفح")});
}

/* ============ LOGIC ============ */
const todayISO=()=>new Date().toISOString();
const dayKey=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=iso=>iso?"⁦"+dayKey(iso)+"⁩":"—";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normNum(s){
  s=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
   .replace(/٫/g,".").replace(/[٬,\s]/g,"").replace(/[^0-9.\-]/g,"");
  if(!s||s==="."||s==="-")return NaN; return parseFloat(s);
}
function attemptsOf(tid){return S.attempts.filter(a=>a.topic===tid).sort((a,b)=>a.at<b.at?-1:1)}
function qStats(tid,qid){
  const list=S.attempts.filter(a=>a.topic===tid&&a.q===qid).sort((a,b)=>a.at<b.at?-1:1);
  const wrong=list.filter(a=>!a.correct);
  let streak=0;for(let i=list.length-1;i>=0&&list[i].correct;i--)streak++;
  const last=list[list.length-1]||null, lastWrong=wrong[wrong.length-1]||null;
  const spaced=last&&last.correct&&lastWrong?dayKey(last.at)>dayKey(lastWrong.at):false;
  const mastered=!!(last&&last.correct&&(wrong.length===0||(streak>=2&&spaced)));
  return {list,wrong,last,streak,mastered};
}
function topicStatus(tid){
  const t=TMAP[tid], p=S.profile.topics[tid]||{};
  const st=t.questions.map(q=>({q,s:qStats(tid,q.id)}));
  const attempted=st.filter(x=>x.s.last);
  const lastAct=[...attemptsOf(tid).map(a=>a.at),p.startedAt,p.notesAt].filter(Boolean).sort().pop()||null;
  let status,reason;
  if(!attempted.length&&!p.startedAt){status="none";reason="لم تُسجَّل أي محاولة أو بداية دراسة"}
  else if(st.some(x=>x.s.last&&!x.s.last.correct)){status="rev";reason="آخر إجابة على سؤال واحد على الأقل خاطئة"}
  else if(attempted.length<st.length){status="prog";reason=`أجبت عن ${attempted.length} من ${st.length} أسئلة`}
  else if(st.every(x=>x.s.mastered)){status="ok";reason="كل الأسئلة صحيحة دون خطأ، أو صحيحة مرتين متتاليتين في يوم لاحق للخطأ"}
  else{status="rev";reason="صحّحت بعد خطأ، أعد الحل في يوم لاحق لتأكيد الإتقان"}
  if(p.review&&status!=="none"){status="rev";reason="حددته بنفسك للمراجعة"}
  const all=attemptsOf(tid);
  return {status,reason,attempts:all.length,correct:all.filter(a=>a.correct).length,lastAct,st};
}
function inRange(iso,f){if(!iso)return !(f.from||f.to);const d=dayKey(iso);if(f.from&&d<f.from)return false;if(f.to&&d>f.to)return false;return true}

let F={topic:"all",level:"all",status:"all",from:"",to:""};

  if(F.topic!=="all"&&t.id!==F.topic)return false;
  if(F.level!=="all"&&String(t.level)!==F.level)return false;
  if(F.status!=="all"&&stat.status!==F.status)return false;
  if((F.from||F.to)&&!inRange(stat.lastAct,F))return false;
  return true;
}
function attemptPass(a){const t=TMAP[a.topic];if(!t)return false;
  if(F.topic!=="all"&&a.topic!==F.topic)return false;

function vGlossary(){
  const q=G.q.trim().toLowerCase();
  const list=GLOSSARY.filter(g=>(G.topic==="all"||g[4]===G.topic)&&(!q||g.slice(0,4).join(" ").toLowerCase().includes(q)));
  return `<div class="wrap"><div><span class="eyebrow">مرجع سريع</span><h1>قاموس المصطلحات</h1><p class="lede">${GLOSSARY.length} مصطلحاً: العربي والإنجليزي والاختصار أو رمز SAP، ومعناه العملي، والدرس الذي يطبّقه</p></div>

function glossList(list){
  if(!list.length)return `<div class="empty">لا يوجد مصطلح يطابق البحث</div>`;
  return TOPICS.filter(t=>list.some(g=>g[4]===t.id)).map(t=>`<div class="card"><div class="sec-h"><h2>${t.title}</h2><a class="small" href="#${t.id}">افتح الدرس</a></div><div class="gl">
   ${list.filter(g=>g[4]===t.id).map(g=>`<div class="term"><div class="th"><b>${g[0]}</b><span class="en">${g[1]}</span><code class="tc plain">${g[2]}</code></div><p>${g[3]}</p></div>`).join("")}</div></div>`).join("");
}

function groupErrors(att){
  const g={};att.filter(a=>!a.correct).forEach(a=>{const k=a.tag||"خطأ غير مصنف";(g[k]=g[k]||{tag:k,n:0,topics:new Set(),last:null});g[k].n++;g[k].topics.add(a.topic);if(!g[k].last||a.at>g[k].last)g[k].last=a.at});
  return Object.values(g).sort((a,b)=>b.n-a.n||(a.last<b.last?1:-1));
}
function errorsHTML(list){
  if(!list.length)return `<div class="empty">لا توجد أخطاء مسجلة في هذه الفترة</div>`;
  return list.map(e=>`<div class="errrow"><div class="cnt ${e.n<2?"once":""}">${e.n}</div><div><b>${esc(e.tag)}</b>${e.n>=2?' <span class="chip rev">متكرر</span>':""}<div class="small muted">${[...e.topics].map(id=>`<a href="#${id}">${TMAP[id].title}</a>`).join("، ")} · آخر مرة ${fmtDate(e.last)}</div></div></div>`).join("");
}
function migrateBanner(){
  if(Store.mode!=="db"||!Store.dbEmpty)return "";

function questionHTML(t,q,i){
  const qs=qStats(t.id,q.id); const last=qs.last;
  let body;
  if(q.type==="mcq"){
    body=`<div class="opts" role="radiogroup">${q.options.map((o,k)=>`<label class="opt"><input type="radio" name="${q.id}" id="${q.id}-o${k}" value="${k}"><span class="en" style="color:var(--ink);font-size:.88rem;white-space:normal">${esc(o[0])}</span></label>`).join("")}</div>
     <div class="row"><button class="btn pri" data-act="check" data-t="${t.id}" data-q="${q.id}">صحّح إجابتي</button></div>`;
  }else{
    body=`<div class="ans"><input type="text" inputmode="decimal" id="${q.id}-in" placeholder="0.00" aria-label="إجابتك"><span class="small muted" style="align-self:center">${q.unit}</span><button class="btn pri" data-act="check" data-t="${t.id}" data-q="${q.id}">صحّح إجابتي</button></div>`;

   <p><b>${q.prompt}</b></p>${body}<div id="fb-${q.id}">${last?fbHTML(q,last):""}</div></div>`;

function fbHTML(q,a){
  const ans=q.type==="mcq"?esc(q.options[+a.answer]?.[0]):esc(a.answer);
  if(a.correct)return `<div class="fb good"><span class="t">إجابة صحيحة</span><span class="small">آخر إجابة: <span class="num">${ans}</span> · ${fmtDate(a.at)}</span><span>${q.solution}</span></div>`;
  return `<div class="fb badf"><span class="t">إجابة غير صحيحة</span><span class="small">آخر إجابة: <span class="num">${ans}</span> · ${fmtDate(a.at)}</span>${a.tag?`<span><b>نوع الخطأ:</b> ${esc(a.tag)}</span>`:""}${a.fb?`<span>${esc(a.fb)}</span>`:""}
   <details class="sol"><summary>عرض الحل</summary><div>${q.solution}</div></details></div>`;
}
function masteryAdvice(t,s){
  if(s.status==="ok")return `<span class="small">انتقل للدرس التالي، وارجع لهذا الدرس عند ظهور حالة مشابهة في مصنعك</span>`;
  if(s.status==="none")return `<span class="small">ابدأ بالشرح ثم المثال وشاشة SAP، ثم أجب عن السؤالين</span>`;
  const bad=s.st.filter(x=>x.s.last&&!x.s.last.correct).map(x=>x.s.last.tag).filter(Boolean);
  if(bad.length)return `<span class="small">ركّز على: ${bad.map(esc).join("، ")}</span>`;
  return "";
}

/* ============ EXPORT ============ */
function exportRows(){
  const topics=TOPICS.map(t=>({t,s:topicStatus(t.id),p:S.profile.topics[t.id]||{}})).filter(r=>topicPass(r.t,r.s));
  const att=S.attempts.filter(attemptPass).sort((a,b)=>a.at<b.at?-1:1);
  return {topics,att,errs:groupErrors(att),qs:S.questions.filter(q=>(F.topic==="all"||q.topic===F.topic)&&inRange(q.at,F))};
}
function filterLabel(){const p=[];if(F.topic!=="all")p.push("الدرس: "+TMAP[F.topic].title);if(F.level!=="all")p.push(LEVELS[F.level]);if(F.status!=="all")p.push("الحالة: "+STATUS[F.status]);if(F.from)p.push("من "+F.from);if(F.to)p.push("إلى "+F.to);return p.join(" · ")||"بدون فلاتر"}
async function getDownloads(){try{return window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){return null}}
async function offer(filename,data){
  const dl=await getDownloads();
  if(!dl){
    try{const types={xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",html:"text/html;charset=utf-8",json:"application/json;charset=utf-8",txt:"text/plain;charset=utf-8",md:"text/markdown;charset=utf-8"};
      const blob=new Blob([data],{type:types[filename.split(".").pop()]||"text/plain;charset=utf-8"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast("نُزّل الملف إلى جهازك")}
    catch(e){toast("تعذر تنزيل الملف")}
    return}
  try{await dl.save({filename,data});toast("أُرسل الملف إلى جهازك")}catch(e){const c=e&&e.code;toast(c==="declined"?"لم يُحفظ الملف":c==="rate_limited"?"نافذة حفظ مفتوحة بالفعل":"تعذر حفظ الملف ("+(c||"خطأ")+")")}
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
async function doXLSX(){
  let X;try{X=await loadXLSX()}catch(e){toast("تعذر تحميل مكتبة Excel، حاول مرة أخرى");return}
  const {topics,att,errs,qs}=exportRows();
  const wb=X.utils.book_new();
  const add=(name,aoa,cols)=>{const ws=X.utils.aoa_to_sheet(aoa);ws["!cols"]=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
  add("ملخص",[["تقرير "+APP_NAME],["إعداد",AUTHOR.name+" · "+AUTHOR.title],["تاريخ التقرير",dayKey(todayISO())],["الفلاتر",filterLabel()],[],["الحالة","عدد الدروس"],...Object.entries(STATUS).map(([k,v])=>[v,topics.filter(r=>r.s.status===k).length]),[],["ملاحظة","الأرقام محسوبة من الإجابات المسجلة فقط"]],[28,44]);
  add("الدروس",[["الدرس","Topic","الوحدة","الحالة","سبب الحالة","المحاولات","الصحيحة","نسبة الصحة","آخر نشاط","مراجعة يدوية","ملاحظاتي (شخصية)","Notion","Anki","ملفات"],
    ...topics.map(({t,s,p})=>[t.title,t.en,LEVELS[t.level],STATUS[s.status],s.reason,s.attempts,s.correct,s.attempts?+(s.correct/s.attempts).toFixed(3):"",s.lastAct?dayKey(s.lastAct):"",p.review?"نعم":"",p.notes||"",p.notion||"",p.anki||"",p.files||""])],[26,22,22,14,40,10,10,10,12,10,40,30,20,24]);
  add("المحاولات",[["التاريخ","الدرس","السؤال","نوع السؤال","إجابتك","النتيجة","نوع الخطأ"],...att.map(a=>{const q=findQ(a.topic,a.q);return [dayKey(a.at),TMAP[a.topic].title,q?q.prompt:a.q,q?.type==="mcq"?"اختيار":"حساب",q&&q.type==="mcq"?q.options[+a.answer]?.[0]:(isNaN(+a.answer)?a.answer:+a.answer),a.correct?"صحيحة":"خاطئة",a.tag||""]})],[12,24,50,10,20,10,36]);
  add("الأخطاء المتكررة",[["نوع الخطأ","التكرار","الدروس","آخر مرة","متكرر"],...errs.map(e=>[e.tag,e.n,[...e.topics].map(id=>TMAP[id].title).join("، "),dayKey(e.last),e.n>=2?"نعم":""])],[40,10,40,12,8]);
  add("أسئلتي",[["التاريخ","الدرس","السؤال","الحالة","إجابتي"],...qs.map(q=>[dayKey(q.at),TMAP[q.topic]?.title||"",q.text,q.status==="done"?"محلول":"مفتوح",q.answer||""])],[12,24,50,10,50]);
  add("المصطلحات",[["المصطلح","Term","SAP","التعريف","الدرس"],...GLOSSARY.map(g=>[g[0],g[1],g[2],g[3],TMAP[g[4]].title])],[26,30,22,60,22]);
  add("موضوعات ناقصة",[["الموضوع","Code","السبب","مصدري"],...MISSING_GLOBAL.map(m=>[m.title,m.en,m.why,S.profile.missing[m.id]?.note||""]),...TOPICS.flatMap(t=>t.missing.map(m=>[m,"",t.title,""]))],[40,22,40,30]);
  wb.Workbook={Views:[{RTL:true}]};
  const buf=X.write(wb,{bookType:"xlsx",type:"array"});
  await offer(`SAP-Cost-Lab-${dayKey(todayISO())}.xlsx`,new Blob([buf]));
}

  <h2>سجل المحاولات</h2>${att.length?`<table><tr><th>التاريخ</th><th>الدرس</th><th>السؤال</th><th>إجابتك</th><th>النتيجة</th><th>نوع الخطأ</th></tr>${att.map(a=>{const q=findQ(a.topic,a.q);return tr([dayKey(a.at),TMAP[a.topic].title,q?q.prompt:a.q,q&&q.type==="mcq"?q.options[+a.answer]?.[0]:a.answer,a.correct?"صحيحة":"خاطئة",a.tag||""])}).join("")}</table>`:'<p class="m">لا توجد محاولات</p>'}
  <footer>${APP_NAME} · إعداد ${AUTHOR.name}، ${AUTHOR.title} · <span class="ltr">${AUTHOR.phone}</span> · <span class="ltr">${AUTHOR.email}</span></footer>
  </body></html>`;

function ankiText(){
  const clean=s=>String(s).replace(/<[^>]+>/g,"").replace(/[\t\n\r]+/g," ").trim();
  const lines=["#separator:tab","#html:false","#tags column:3"];
  TOPICS.forEach(t=>t.questions.forEach(q=>{
    const front=q.type==="mcq"?`${q.prompt} [${q.options.map(o=>o[0]).join(" | ")}]`:`${q.prompt} (${q.unit})`;
    lines.push([clean(front),clean(q.solution),`SAP_CO ${t.id} lesson`].join("\t"));
  }));
  GLOSSARY.forEach(g=>lines.push([`${g[1]} (${g[2]})`,`${g[0]}: ${g[3]}`,`SAP_CO ${g[4]} glossary`].join("\t")));
  S.questions.filter(q=>q.status==="done"&&q.answer).forEach(q=>lines.push([clean(q.text),clean(q.answer),`SAP_CO ${q.topic} my_question`].join("\t")));
  return lines.join("\n");
}
function notionMD(){
  const {topics,errs}=exportRows();
  let md=`# تدريب SAP S/4HANA CO\n\n${APP_NAME} · إعداد ${AUTHOR.name}\n\nتاريخ التصدير: ${dayKey(todayISO())} · ${filterLabel()}\n\n## التقدم\n\n| الدرس | الوحدة | الحالة | المحاولات | آخر نشاط |\n|---|---|---|---|---|\n`;
  md+=topics.map(({t,s})=>`| ${t.title} | ${t.level} | ${STATUS[s.status]} | ${s.attempts} | ${s.lastAct?dayKey(s.lastAct):"—"} |`).join("\n");
  md+=`\n\n## ملاحظاتي\n\n`+(topics.filter(r=>r.p.notes).map(r=>`### ${r.t.title}\n\n${r.p.notes}\n`).join("\n")||"لا توجد ملاحظات\n");
  md+=`\n## الأخطاء المتكررة\n\n`+(errs.map(e=>`- ${e.tag} (${e.n})`).join("\n")||"لا توجد أخطاء مسجلة");
  md+=`\n\n## أسئلة مفتوحة\n\n`+(S.questions.filter(q=>q.status!=="done").map(q=>`- [ ] ${q.text} (${TMAP[q.topic]?.title||""})`).join("\n")||"لا توجد");
  return md+"\n";
}

/* ============ ROUTER & RENDER ============ */
let pendingRender=false;
function route(){const h=(location.hash||"").replace("#","");return (h&&(TMAP[h]||PAGES.includes(h)))?h:"home"}
function render(force){
  const ae=document.activeElement;
  if(!force&&ae&&ae.closest&&ae.closest("#main")&&/^(TEXTAREA|INPUT)$/.test(ae.tagName)&&!["radio","checkbox","date","file"].includes(ae.type)){pendingRender=true;return}
  pendingRender=false;
  const r=route(); renderNav(r);
  const m=document.getElementById("main");
  const draft={};m.querySelectorAll("input[id$='-in'],input[id^='myq-'],#lq-text").forEach(i=>{if(i.value)draft[i.id]=i.value});
  const V={home:vHome,guide:vGuide,glossary:vGlossary,dashboard:vDashboard,plan:vPlan,lessons:vLessons,log:vLog,reports:vReports,links:vLinks};
  m.innerHTML=V[r]?V[r]():vTopic(TMAP[r]);
  Object.entries(draft).forEach(([id,v])=>{const i=document.getElementById(id);if(i)i.value=v});
}
let lastRoute=null;
function onRoute(){render(true);const r=route();if(r!==lastRoute){window.scrollTo(0,0);lastRoute=r}}
window.addEventListener("hashchange",onRoute);
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender)render()},0)});

let toastT;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ============ EVENTS ============ */
document.addEventListener("click",async e=>{
  const tm=e.target.closest("[data-term]");if(tm){G.q=tm.dataset.term;G.topic="all";if(location.hash==="#glossary"){e.preventDefault();render(true)}return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="check"){
    const t=TMAP[b.dataset.t],q=findQ(b.dataset.t,b.dataset.q);let answer,correct,tag=null,fb=null;
    if(q.type==="mcq"){const sel=document.querySelector(`input[name="${q.id}"]:checked`);if(!sel){toast("اختر إجابة أولاً");return}
      answer=sel.value;correct=+answer===q.correct;if(!correct){tag=q.tags[+answer];fb=q.options[+answer][1]}}
    else{const inp=document.getElementById(q.id+"-in");const x=normNum(inp.value);if(isNaN(x)){toast("أدخل رقماً");inp.focus();return}
      answer=String(x);correct=Math.abs(Math.abs(x)-q.answer)<=q.tol;
      if(!correct){const w=q.wrongs.find(w=>Math.abs(Math.abs(x)-w[0])<=w[1]);if(w){tag=w[2];fb=w[3]}else{tag="خطأ حسابي غير مصنف";fb="راجع خطوات الحساب في المثال، ثم أعد المحاولة"}}}
    const a={id:uidGen("att_"),kind:"attempt",topic:t.id,q:q.id,type:q.type,answer,correct,tag,fb,at:todayISO()};
    S.attempts.push(a);const {id,...body}=a;saveDoc(id,body);
    render(true);const box=document.getElementById("box-"+q.id);if(box)box.scrollIntoView({block:"nearest"});
    toast(correct?"إجابة صحيحة، سُجّلت":"سُجّلت المحاولة في سجل الأخطاء");
  }
  else if(act==="copy"){const v=b.dataset.v;try{await navigator.clipboard.writeText(v);toast("نُسخ: "+v)}catch(x){const el=[...document.querySelectorAll(".val")].find(n=>n.textContent===v);if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("حُدد النص، انسخه يدوياً")}}
  else if(act==="start"){tp(b.dataset.t).startedAt=todayISO();saveProfile(0);render(true)}
  else if(act==="addq"||act==="addq-log"){
    const tid=act==="addq"?b.dataset.t:document.getElementById("lq-topic").value;
    const inp=document.getElementById(act==="addq"?"myq-"+tid:"lq-text");const text=inp.value.trim();if(!text){toast("اكتب السؤال أولاً");return}
    const q={id:uidGen("q_"),kind:"question",topic:tid,text,status:"open",answer:"",at:todayISO()};S.questions.push(q);inp.value="";
    const {id,...body}=q;saveDoc(id,body);render(true);toast("أُضيف السؤال إلى سجلك");
  }
  else if(act==="toggleq"){const q=S.questions.find(x=>x.id===b.dataset.id);q.status=q.status==="done"?"open":"done";const {id,_t,...body}=q;saveDoc(id,body);render(true)}
  else if(act==="delq"){S.questions=S.questions.filter(x=>x.id!==b.dataset.id);deleteDoc(b.dataset.id);render(true)}
  else if(act==="clear-filters"){F={topic:"all",level:"all",status:"all",from:"",to:""};saveUI();render(true)}
  else if(act==="xlsx")doXLSX();
  else if(act==="html")offer(`SAP-Cost-Lab-Report-${dayKey(todayISO())}.html`,reportHTML());
  else if(act==="json")offer(`SAP-Cost-Lab-Backup-${dayKey(todayISO())}.json`,JSON.stringify({app:"sapco-lab",v:1,exportedAt:todayISO(),data:S},null,1));
  else if(act==="prep-anki"||act==="prep-notion"){
    const anki=act==="prep-anki";const txt=anki?ankiText():notionMD();window.__prep={name:anki?`SAP-Cost-Lab-Anki-${dayKey(todayISO())}.txt`:`SAP-Cost-Lab-Notion-${dayKey(todayISO())}.md`,txt};
    document.getElementById("prep").innerHTML=`<div class="confirm"><b>راجع المحتوى قبل إنشاء الملف</b><span class="small">${anki?`${txt.split("\n").length-3} بطاقة. استوردها في Anki من File ثم Import، واختر المجموعة بنفسك`:"استورده في Notion من Import ثم Markdown"}. لن يُرسل شيء إلى ${anki?"Anki":"Notion"}</span><pre>${esc(txt.slice(0,3000))}${txt.length>3000?"\n…":""}</pre><div class="row"><button class="btn pri" data-act="prep-save">تأكيد وإنشاء الملف</button><button class="btn" data-act="prep-cancel">إلغاء</button></div></div>`;
  }
  else if(act==="prep-save"){if(window.__prep)offer(window.__prep.name,window.__prep.txt);document.getElementById("prep").innerHTML=""}
  else if(act==="prep-cancel"){document.getElementById("prep").innerHTML=""}
  else if(act==="wipe-ask"){document.getElementById("wipe-box").innerHTML=`<div class="confirm" style="border-color:var(--bad);background:var(--bad-soft)"><b>تأكيد المسح</b><span class="small">سيُحذف ${S.attempts.length} محاولة و${S.questions.length} سؤال وكل ملاحظاتك. لا يمكن التراجع</span><div class="row"><button class="btn warn" data-act="wipe">نعم، امسح كل شيء</button><button class="btn" data-act="wipe-cancel">إلغاء</button></div></div>`}
  else if(act==="wipe-cancel"){render(true)}
  else if(act==="wipe"){const ids=[...S.attempts.map(a=>a.id),...S.questions.map(q=>q.id)];S=emptyState();
    if(Store.mode==="db"){ids.forEach(deleteDoc);Store.q=Store.q.then(()=>Store.col.doc("profile").delete()).catch(()=>{})}else saveLocal();render(true);toast("مُسحت البيانات")}
  else if(act==="migrate"||act==="import-ok"){
    const src=act==="migrate"?loadLocal():window.__import;if(!src)return;
    const have=new Set(S.attempts.map(a=>a.id).concat(S.questions.map(q=>q.id)));
    src.attempts.forEach(a=>{if(!have.has(a.id)){S.attempts.push(a);const {id,...b}=a;saveDoc(id,Object.assign({kind:"attempt"},b))}});
    src.questions.forEach(q=>{if(!have.has(q.id)){S.questions.push(q);const {id,...b}=q;saveDoc(id,Object.assign({kind:"question"},b))}});
    S.profile=mergeProfile(S.profile,src.profile);saveProfile(0);
    if(act==="migrate")Store.dbEmpty=false;
    window.__import=null;render(true);toast(act==="migrate"?"نُقل تقدمك إلى حسابك":"استُوردت النسخة الاحتياطية");
  }
  else if(act==="import-cancel"){window.__import=null;document.getElementById("imp-confirm").innerHTML=""}
});
function mergeProfile(a,b){const out=JSON.parse(JSON.stringify(a||{topics:{},missing:{},plan:{}}));b=b||{};
  ["topics","missing","plan"].forEach(k=>{out[k]=out[k]||{};Object.entries(b[k]||{}).forEach(([id,v])=>{out[k][id]=Object.assign({},v,out[k][id]||{})})});return out}

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.f){F[el.dataset.f]=el.value;saveUI();render(true);return}
  if(el.id==="g-topic"){G.topic=el.value;render(true);return}
  if(el.dataset.review){tp(el.dataset.review).review=el.checked;saveProfile(0);render(true);return}
  if(el.dataset.plan){(S.profile.plan[el.dataset.plan]=S.profile.plan[el.dataset.plan]||{}).target=el.value;saveProfile(0);render(true);return}
  if(el.id==="imp"&&el.files&&el.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.app!=="sapco-lab"||!d.data)throw 0;
      window.__import={profile:d.data.profile||{},attempts:d.data.attempts||[],questions:d.data.questions||[]};
      document.getElementById("imp-confirm").innerHTML=`<div class="confirm"><b>استيراد نسخة ${esc(fmtDate(d.exportedAt))}</b><span class="small">${window.__import.attempts.length} محاولة و${window.__import.questions.length} سؤال. تُضاف إلى بياناتك الحالية دون حذف شيء</span><div class="row"><button class="btn pri" data-act="import-ok">تأكيد الاستيراد</button><button class="btn" data-act="import-cancel">إلغاء</button></div></div>`;
    }catch(x){toast("الملف ليس نسخة احتياطية من هذه المنصة")}};fr.readAsText(el.files[0]);el.value="";
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="g-q"){G.q=el.value;const q=G.q.trim().toLowerCase();document.getElementById("g-list").innerHTML=glossList(GLOSSARY.filter(g=>(G.topic==="all"||g[4]===G.topic)&&(!q||g.slice(0,4).join(" ").toLowerCase().includes(q))));return}
  if(el.dataset.docs){tp(el.dataset.docs).docs=el.value;saveProfile(900);return}
  if(el.dataset.notes){const p=tp(el.dataset.notes);p.notes=el.value;p.notesAt=todayISO();saveProfile(900)}
  else if(el.dataset.link){tp(el.dataset.t)[el.dataset.link]=el.value.trim();saveProfile(900)}
  else if(el.dataset.missing){(S.profile.missing[el.dataset.missing]=S.profile.missing[el.dataset.missing]||{}).note=el.value;saveProfile(900)}
  else if(el.dataset.qans){const q=S.questions.find(x=>x.id===el.dataset.qans);if(q){q.answer=el.value;clearTimeout(q._t);q._t=setTimeout(()=>{const {id,_t,...body}=q;saveDoc(id,body)},900)}}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;const el=e.target;
  if(el.id&&el.id.endsWith("-in")){const b=el.closest(".q")?.querySelector("[data-act=check]");if(b){e.preventDefault();b.click()}}
  else if(el.id&&el.id.startsWith("myq-")){e.preventDefault();el.parentElement.querySelector("[data-act=addq]").click()}
  else if(el.id==="lq-text"){e.preventDefault();document.querySelector("[data-act=addq-log]").click()}
});

setStoreChip();
initStore();
